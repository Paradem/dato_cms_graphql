name: Ruby

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Ruby 4.0.10 / Rails 8.1
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.10"
          bundler-cache: true
      - run: |
          mkdir -p tmp/security
          bundle exec bundle-audit check --update --format json --output tmp/security/bundle-audit.json
      - run: bundle exec rake test
        env:
          SE_SKIP_DRIVER_IN_PATH: "true"
      - run: bundle exec standardrb
      - run: gem build dato_cms_graphql.gemspec --output /tmp/dato_cms_graphql.gem
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cms-evidence-ruby-4.0.10-rails-8.1
          path: |
            tmp/generator-evidence
            tmp/portability-evidence
            tmp/security
          if-no-files-found: error
